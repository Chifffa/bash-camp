# tmux, linked to ~/.config/tmux by bash-camp. Best with tmux >= 3.2; older versions parse it,
# minus a few features.

# --- Terminal -------------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -sa terminal-features ",xterm-ghostty:RGB"
set -ga terminal-overrides ",xterm-ghostty:Tc"

# --- General --------------------------------------------------------------------------------------
# A non-login bash without TMOUT: login panes re-read /etc/profile.d, where some servers set
# `readonly TMOUT`, and bash then logs every idle pane out.
set -g default-command "env -u TMOUT bash"
set -s escape-time 10
set -s focus-events on
set -g history-limit 50000
set -g display-time 4000
set -g status-position top
set -g mouse on

# Forwarded SSH agent: pin panes to the stable link the RC addon keeps, and stop every attach from
# replacing it with the client's short-lived socket. Only where that link exists; elsewhere new
# panes would get a dead path. if-shell, not %if, for tmux 3.0.
if-shell '[ -L "$HOME/.ssh/ssh_auth_sock" ]' 'set-environment -g SSH_AUTH_SOCK "$HOME/.ssh/ssh_auth_sock"'
if-shell '[ -L "$HOME/.ssh/ssh_auth_sock" ]' 'set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_CONNECTION WINDOWID XAUTHORITY"'

# --- Keys -----------------------------------------------------------------------------------------
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf
bind -r m resize-pane -Z

# Copy mode: vi keys, `v` starts a selection, copies reach the system clipboard (OSC 52).
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
set -g set-clipboard on

# --- Plugins --------------------------------------------------------------------------------------
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.0'

set -g @yank_selection_mouse 'clipboard'

# Ctrl-h/j/k/l move between tmux and vim panes.
set -g @vim_navigator_mapping_left 'C-h'
set -g @vim_navigator_mapping_down 'C-j'
set -g @vim_navigator_mapping_up 'C-k'
set -g @vim_navigator_mapping_right 'C-l'
set -g @vim_navigator_mapping_prev ''
set -g @vim_navigator_prefix_mapping_clear_screen ''

set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_window_status_style 'rounded'
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_application}'

run '~/.tmux/plugins/tpm/tpm'
