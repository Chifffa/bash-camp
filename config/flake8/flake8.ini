# flake8, linked to ~/.config/flake8 by bash-camp: the defaults `check` uses where a project has no
# flake8 configuration. It runs only wemake-python-styleguide; ruff does everything else.
[flake8]
extend-exclude =
    .cache
    .venv
select =
    WPS5
    WPS3
    WPS101
    WPS102
    WPS116
    WPS117
    WPS119
    WPS405
    WPS406
    WPS409
    WPS418
    WPS422
    WPS438
    WPS439
    WPS443
    WPS444
    WPS445
    WPS446
    WPS447
    WPS448
    WPS449
    WPS455
    WPS460
    WPS463
    WPS464
    WPS466
    WPS468
    WPS469
    WPS470
    WPS471
    WPS472
    WPS473
    WPS477
    WPS479
    WPS480
    WPS481
    WPS601
    WPS605
    WPS607
    WPS608
    WPS610
    WPS611
    WPS613
    WPS616
    WPS617
extend-ignore =
    WPS300
    WPS301
    WPS332
    WPS347
    WPS349
    WPS350
    WPS358
    WPS362
    WPS501
    WPS505
    WPS506
    WPS518
    WPS519
per-file-ignores =
    # A hyphenated name is a command, never imported as a module.
    *-*: WPS102
