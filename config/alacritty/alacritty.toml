# Alacritty, linked to ~/.config/alacritty by bash-camp.

[env]
# Remote hosts rarely have Alacritty's own terminfo entry.
TERM = "xterm-256color"

[window]
padding = { x = 20, y = 20 }
# Alacritty matches these case-insensitively; the schema wants them lower-case.
decorations = "full"
opacity = 0.8
blur = true

[font]
# Installed by bash-camp on desktops.
normal = { family = "JetBrainsMono Nerd Font Mono" }
size = 24

[keyboard]
# Alt+Left/Right move by word, as Alt+B/Alt+F do in readline and ble.sh.
bindings = [
  { key = "Right", mods = "Alt", chars = "\u001BF" },
  { key = "Left", mods = "Alt", chars = "\u001BB" },
]
